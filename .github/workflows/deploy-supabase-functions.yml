name: Deploy Nexus Science translation function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-translation-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy translation function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing required GitHub Actions secrets."
            exit 1
          fi
          supabase functions deploy translate-published-course --project-ref "$SUPABASE_PROJECT_ID"
